; TX node - Seeed XIAO ESP32-C6, onboard ceramic antenna, USB power bank.
;
; This board's only job is to transmit at a steady high rate so the bench node
; can measure CSI. It never joins the bench and has no data link to the laptop.
; Wi-Fi CSI measures channel perturbation between two separated antennas, so
; co-locating the nodes measures nothing useful.
;
; The C6 ships with ESPHome pre-flashed; this replaces it.

[env:tx]
; The official espressif32 platform does not list arduino as a supported
; framework for seeed_xiao_esp32c6 at any published version - its board
; manifest predates C6 Arduino support. The pioarduino fork tracks current
; Arduino cores and does support it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
