; Bench node - Seeed XIAO ESP32-S3 seated in the MR60BHA2 carrier.
;
; Host link is native USB CDC on the XIAO's own USB-C port, not the UART
; bridge. That matters because the radar sits on UART0 (see M3 in
; HARDWARE_BRINGUP_BRIEF.md), so the serial console cannot share those pins.

[env:bench]
; Pinned. Building the C6 env pulled a newer shared framework package, which
; broke this env's WiFi build. The bench node stays on the core that brought up
; thermal and radar successfully; only the TX env tracks a newer Arduino core.
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; Adafruit BusIO pulls in SPI.h unconditionally, and the dependency finder
; drops SPI from the graph whenever a sketch does not itself include it. Naming
; both buses keeps the build stable across sketches that use neither.
lib_ldf_mode = deep+
lib_deps =
  adafruit/Adafruit MLX90640@^1.1.1
  Wire
  SPI
