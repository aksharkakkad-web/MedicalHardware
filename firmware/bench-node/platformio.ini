; Bench node - Seeed XIAO ESP32-S3 seated in the MR60BHA2 carrier.
;
; Host link is native USB CDC on the XIAO's own USB-C port, not the UART
; bridge. That matters because the radar sits on UART0 (see HARDWARE_BRINGUP
; brief M3), so the serial console cannot share those pins.

[env:bench]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
