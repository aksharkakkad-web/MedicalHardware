name: repository-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and test dependencies
        run: python3 -m pip install -e '.[dev]'

      - name: Validate complete backend suite
        run: python3 -m pytest -q

      - name: Validate unittest compatibility
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Reject committed generated files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|[^/]+\.py[co]$|\.DS_Store$)'; then
            echo 'Generated local files must not be committed.' >&2
            exit 1
          fi
